<style>
:root{
  --chord-color:#8B1A1A;
  --red:#8B1A1A;--red-l:#B22222;--red-muted:rgba(139,26,26,0.1);
  --gold:#C9973A;--gold-l:#E8C06A;--gold-muted:rgba(201,151,58,0.12);
  --blue:#1A2A4A;--blue-mid:#2C4074;--blue-light:rgba(44,64,116,0.1);
  --bg:#FFFFFF;--bg2:#F7F8FC;--bg3:#EEEEF6;
  --surface:#FFFFFF;--border:#E0E0EE;
  --text:#1A1A2E;--text2:#5A5A7A;--text3:#9898B8;
  --nav-bg:rgba(255,255,255,0.97);
  --shadow:0 2px 12px rgba(26,42,74,0.08);
  --shadow-lg:0 8px 32px rgba(26,42,74,0.14);
  --r:16px;--rs:10px;
}
[data-theme=dark]{
  --chord-color:#ff9999;
  --bg:#0A0B12;--bg2:#0F1020;--bg3:#161828;
  --surface:#161828;--border:#1E2035;
  --text:#F0F0FF;--text2:#9090BB;--text3:#484870;
  --nav-bg:rgba(10,11,18,0.98);
  --shadow:0 2px 12px rgba(0,0,0,0.5);
  --shadow-lg:0 8px 32px rgba(0,0,0,0.7);
  --red:#e05555;--red-l:#ff6666;--red-muted:rgba(224,85,85,0.15);
  --gold:#E8B84B;--gold-l:#F5CF7A;--gold-muted:rgba(232,184,75,0.12);
  --blue-light:rgba(44,64,116,0.25);
  --blue-mid:#6080CC;
}

/* ── SKELETON LOADING ── */
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.skeleton{background:linear-gradient(90deg,var(--bg3) 25%,var(--border) 50%,var(--bg3) 75%);background-size:800px 100%;animation:shimmer 1.4s infinite;border-radius:8px}
.skeleton-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.skeleton-thumb{width:100%;aspect-ratio:16/10}
.skeleton-body{padding:13px 15px 15px;display:flex;flex-direction:column;gap:8px}

/* ── CARD FADE-IN ANIMATION ── */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.song-card{animation:fadeInUp .25s cubic-bezier(.22,.61,.36,1) both}
.song-card:nth-child(1){animation-delay:0s}
.song-card:nth-child(2){animation-delay:.04s}
.song-card:nth-child(3){animation-delay:.08s}
.song-card:nth-child(4){animation-delay:.12s}
.song-card:nth-child(5){animation-delay:.16s}
.song-card:nth-child(n+6){animation-delay:.2s}

/* ── FONT SIZE SLIDER ── */
.font-size-ctrl{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--bg3);border-radius:100px;border:1px solid var(--border)}
.font-size-ctrl input[type=range]{width:80px;accent-color:var(--blue-mid);cursor:pointer}
.font-size-ctrl span{font-size:11px;font-weight:700;color:var(--text3);min-width:26px;text-align:center}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:15px;transition:background .3s,color .3s}

/* NAV */
nav{position:sticky;top:0;z-index:500;background:var(--nav-bg);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 20px;transition:background .3s,border-color .3s}
.nav-inner{max-width:1160px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px}
.nav-logo{display:flex;align-items:center;gap:10px;cursor:pointer;text-decoration:none}
.nav-logo img{width:38px;height:38px;border-radius:10px;object-fit:cover}
.logo-text{font-size:17px;font-weight:700;color:var(--text)}
[data-theme=light] .logo-text{color:#1a2a4a}
.logo-text span{color:var(--gold)}
.nav-right{display:flex;align-items:center;gap:6px}
.nav-links{display:flex;gap:2px;list-style:none}
.nav-links a{text-decoration:none;color:var(--text2);font-size:13.5px;font-weight:500;padding:6px 13px;border-radius:8px;transition:all .18s;cursor:pointer}
[data-theme=light] .nav-links a{color:#2a2a4a}
[data-theme=light] .nav-links a:hover,[data-theme=light] .nav-links a.active{background:#eef2fa;color:#1a2a4a}
.nav-links a:hover,.nav-links a.active{background:var(--blue-light);color:var(--blue-mid)}
[data-theme=dark] .nav-links a:hover,[data-theme=dark] .nav-links a.active{color:#8aabff}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1.5px solid var(--border);background:var(--bg3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;transition:all .2s;flex-shrink:0}.icon-btn#themeBtn{background:var(--blue);border-color:var(--blue-mid);color:#fff;font-size:15px;font-weight:700}
[data-theme=light] .icon-btn#themeBtn{background:var(--blue);color:#fff}
[data-theme=dark] .icon-btn#themeBtn{background:var(--blue-mid);color:#fff}
.icon-btn:hover{border-color:var(--gold);background:var(--gold-muted)}
.hamburger{display:none;background:none;border:none;cursor:pointer;flex-direction:column;gap:5px;padding:4px}
.hamburger span{display:block;width:22px;height:2px;background:var(--text);border-radius:2px;transition:.2s}

/* PAGES */
.page{display:none}.page.active{display:block}

/* HERO */
.hero{position:relative;padding:90px 24px 72px;text-align:center;overflow:hidden;min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center top;background-repeat:no-repeat}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,18,40,0.72) 0%,rgba(10,18,40,0.85) 60%,rgba(10,18,40,0.92) 100%);pointer-events:none;z-index:1}
.hero-content{position:relative;z-index:10;overflow:visible}

.hero-badge{display:inline-block;background:rgba(201,151,58,0.2);border:1px solid rgba(201,151,58,0.45);color:var(--gold-l);font-size:11px;font-weight:600;letter-spacing:.1em;padding:4px 14px;border-radius:100px;margin-bottom:18px;text-transform:uppercase}
.hero h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:800;color:#fff;line-height:1.1;margin-bottom:10px}
.hero h1 span{color:var(--gold-l)}
.hero-tagline{font-size:clamp(.95rem,2.5vw,1.15rem);color:rgba(255,255,255,0.7);margin-bottom:6px}
.hero-sub{font-size:13.5px;color:rgba(255,255,255,0.45);max-width:500px;margin:0 auto 34px}
.search-outer{max-width:540px;margin:0 auto;position:relative;width:100%}
.search-wrap{display:flex;position:relative;z-index:9999}
.search-wrap input{width:100%;padding:14px 54px 14px 22px;border-radius:100px;border:2px solid rgba(255,255,255,0.18);background:rgba(255,255,255,0.12);color:#fff;font-family:'Poppins',sans-serif;font-size:14px;outline:none;transition:border-color .2s,background .2s}
.search-wrap input::placeholder{color:rgba(255,255,255,0.42)}
.search-wrap input:focus{border-color:var(--gold);background:rgba(255,255,255,0.17)}
.search-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:100px;background:var(--gold);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .18s}
.search-btn:hover{background:var(--gold-l)}
.ac-drop{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);overflow:hidden;box-shadow:var(--shadow-lg);z-index:9999;display:none;max-height:420px;overflow-y:auto;scrollbar-width:thin}
#heroAC{position:fixed;z-index:9999;display:none;max-height:420px;overflow-y:auto;scrollbar-width:thin;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);box-shadow:var(--shadow-lg)}
.ac-drop.open{display:block}
#heroAC.open{display:block}
[data-tip]{position:relative}
[data-tip]::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:rgba(20,20,30,0.92);color:#fff;font-size:11px;font-family:'Poppins',sans-serif;white-space:nowrap;padding:4px 9px;border-radius:6px;pointer-events:none;opacity:0;transition:opacity .18s;z-index:99995;line-height:1.4;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
[data-tip]:hover::after{opacity:1}
.ac-item{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item.focused{background:var(--bg3)}
.ac-thumb{width:42px;height:42px;border-radius:8px;object-fit:cover;flex-shrink:0}
.ac-name{font-size:13px;font-weight:700;color:var(--text)}
.ac-name em{color:var(--gold);font-style:normal}
.ac-sub{font-size:11px;color:var(--text3)}
.ac-sub em{color:var(--gold-l);font-style:normal;font-weight:600}

/* SECTIONS */
.section{padding:56px 24px}
.section-inner{max-width:1160px;margin:0 auto}
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.section-title{font-size:1.3rem;font-weight:700;color:var(--text);display:flex;align-items:center;gap:10px}
.section-title::before{content:'';display:block;width:4px;height:20px;background:linear-gradient(to bottom,var(--red),var(--gold));border-radius:4px}
.see-all{font-size:13px;font-weight:600;color:var(--red);cursor:pointer;text-decoration:none;transition:color .18s}
.see-all:hover{color:var(--red-l)}

/* SONG CARDS */
.songs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.song-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);transition:box-shadow .25s,transform .25s,border-color .25s;cursor:pointer;contain:layout style;display:flex;flex-direction:column}
.song-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-4px);border-color:var(--gold-l)}
.card-thumb{width:100%;aspect-ratio:16/10;position:relative;overflow:hidden}
.card-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .4s;display:block}
.song-card:hover .card-thumb img{transform:scale(1.07)}
.card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.7) 0%,transparent 60%)}
.card-key-badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.55);backdrop-filter:blur(6px);color:var(--gold-l);font-size:11px;font-weight:700;padding:2px 9px;border-radius:100px;border:1px solid rgba(201,151,58,0.4)}
.card-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s}
.song-card:hover .card-play{opacity:1}
/* Touch devices: always show the play affordance at low opacity */
@media(hover:none){.card-play{opacity:0.65}}
.play-circle{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,0.18);backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;padding-left:3px}
.card-body{padding:13px 15px 15px;display:flex;flex-direction:column;flex:1}
.card-title{font-size:13.5px;font-weight:700;color:var(--text);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-orig{font-size:11px;color:var(--text3);font-style:italic;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-artist{font-size:12px;color:var(--text2);font-weight:500;margin:4px 0 0;display:flex;align-items:center;gap:4px}
.card-artist::before{content:'♪';font-size:10px;color:var(--gold)}
.btn-card{width:100%;padding:7px 0;border-radius:100px;background:var(--red);color:#fff;border:none;font-family:'Poppins',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:background .18s,box-shadow .18s;margin-top:auto;display:block}
.btn-card:hover{background:var(--red-l);box-shadow:0 4px 14px rgba(139,26,26,0.35)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 20px;border-radius:100px;font-family:'Poppins',sans-serif;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:all .18s;text-decoration:none}
.btn-primary{background:var(--red);color:#fff}.btn-primary:hover{background:var(--red-l)}
.btn-gold{background:var(--gold);color:#fff}.btn-gold:hover{background:var(--gold-l)}
.btn-outline{background:transparent;border:2px solid var(--border);color:var(--text2)}.btn-outline:hover{border-color:var(--blue-mid);color:var(--text)}
.btn-ghost{background:transparent;color:var(--text2)}.btn-ghost:hover{background:var(--bg3);color:var(--text)}
.btn-danger{background:#dc2626;color:#fff}.btn-danger:hover{background:#b91c1c}
.btn-sm{padding:6px 14px;font-size:12px}

/* SONG DETAIL */
.song-wrap{max-width:860px;margin:0 auto;padding:36px 24px 60px}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);font-weight:500;background:none;border:none;cursor:pointer;margin-bottom:26px;padding:0;font-family:'Poppins',sans-serif;transition:color .18s}
.back-btn:hover{color:var(--text)}
.song-htitle{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:800;color:var(--text)}
.song-horig{font-size:14px;color:var(--text3);font-style:italic;margin-top:4px}
.tag-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:100px;font-size:11.5px;font-weight:600}
.tag-blue{background:var(--blue-light);color:var(--blue-mid)}
.tag-gold{background:var(--gold-muted);color:#8a6010}
.tag-red{background:var(--red-muted);color:var(--red)}
[data-theme=dark] .tag-blue{color:#8aabff}
[data-theme=dark] .tag-gold{color:var(--gold-l)}
[data-theme=dark] .tag-red{color:#f08080}
.video-box{background:var(--bg3);border-radius:var(--r);aspect-ratio:16/9;overflow:hidden;margin:24px 0;display:flex;align-items:center;justify-content:center}
.video-box iframe{width:100%;height:100%;border:none}
.video-placeholder{text-align:center;color:var(--text3);font-size:14px}
.ctrl-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px;padding:14px 0}
.inst-btn{padding:7px 18px;border-radius:100px;border:2px solid var(--border);background:var(--surface);cursor:pointer;font-family:'Poppins',sans-serif;font-size:13px;font-weight:600;color:var(--text2);transition:all .18s}
.inst-btn.active,.inst-btn:hover{border-color:var(--blue-mid);background:var(--blue-light);color:var(--blue-mid)}
[data-theme=dark] .inst-btn.active{color:#8aabff}
.ctrl-label{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.transpose-ctrl{display:flex;align-items:center;gap:6px;margin-left:auto}
.transpose-ctrl span{font-size:13px;font-weight:700;color:var(--text);min-width:44px;text-align:center;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:4px 8px}
.t-btn{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;font-size:16px;font-weight:700;color:var(--text2);display:flex;align-items:center;justify-content:center;transition:all .18s}
.t-btn:hover{background:var(--gold-muted);border-color:var(--gold);color:var(--gold)}
.lyrics-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:28px 32px;line-height:1.9;overflow-x:auto;-webkit-overflow-scrolling:touch}
.sec-lbl{display:inline-block;color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:2px 9px;border-radius:6px;margin-bottom:8px}
.lyric-block{margin-bottom:26px}
.lyric-line{margin-bottom:5px}
.chord-row{font-size:14px;font-weight:700;color:var(--chord-color);font-family:'Roboto Mono','Courier New',monospace;min-height:18px;white-space:pre;overflow-x:auto;line-height:1.4}
[data-theme=dark] .chord-row{color:#f08080}
.lyric-sq{font-weight:600;color:var(--text);font-family:'Roboto Mono','Courier New',monospace;font-size:14px;line-height:1.7}
.lyric-en{color:var(--text3);font-size:13px;font-style:italic;font-family:'Roboto Mono','Courier New',monospace}
.dl-bar{margin-top:28px;padding:20px 24px;background:var(--gold-muted);border:1px solid rgba(201,151,58,0.3);border-radius:var(--r);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.dl-text{font-size:14px;font-weight:600;color:var(--text)}
.dl-sub{font-size:11.5px;color:var(--text3);margin-top:2px}
.dl-btns{display:flex;gap:8px;flex-wrap:wrap}

/* LIBRARY */
.page-hero{background:linear-gradient(135deg,#080f20,var(--blue-mid));padding:44px 24px;text-align:center;color:#fff}
.page-hero h1{font-size:1.9rem;font-weight:800;margin-bottom:5px}
.page-hero p{color:rgba(255,255,255,0.55);font-size:13.5px}
.filters-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px;align-items:center}
.lib-search-wrap{flex:1;min-width:200px;position:relative;z-index:500}
.f-input{width:100%;padding:10px 42px 10px 16px;border-radius:100px;border:2px solid var(--border);font-family:'Poppins',sans-serif;font-size:13px;outline:none;background:var(--surface);color:var(--text);transition:border-color .18s}
.f-input:focus{border-color:var(--blue-mid)}
.f-input::placeholder{color:var(--text3)}
.f-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none}
.f-select{padding:10px 14px;border-radius:100px;border:2px solid var(--border);background:var(--surface);font-family:'Poppins',sans-serif;font-size:13px;outline:none;cursor:pointer;color:var(--text);min-width:130px;transition:border-color .18s}
.f-select:focus{border-color:var(--blue-mid)}
.lib-ac{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);overflow:hidden;box-shadow:var(--shadow-lg);z-index:600;display:none}
.lib-ac.open{display:block}

/* ABOUT */
.about-inner{max-width:860px;margin:0 auto;padding:56px 24px}
.about-subtitle{font-size:1.2rem;font-weight:700;color:var(--text);margin-bottom:13px;display:flex;align-items:center;gap:10px}
.about-subtitle::before{content:'';display:block;width:4px;height:19px;background:linear-gradient(to bottom,var(--red),var(--gold));border-radius:4px}
.about-quote{background:var(--blue-light);border-left:4px solid var(--blue-mid);padding:18px 22px;border-radius:0 var(--rs) var(--rs) 0;font-size:13.5px;color:var(--text);line-height:1.8;margin-bottom:28px}
.feat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-bottom:36px}
.feat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px}
.feat-icon{font-size:26px;margin-bottom:10px}
.feat-title{font-size:13.5px;font-weight:700;color:var(--text);margin-bottom:5px}
.feat-desc{font-size:12.5px;color:var(--text2);line-height:1.7}

/* GUIDE */
.guide-inner{max-width:860px;margin:0 auto;padding:56px 24px}
.g-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:26px;margin-bottom:18px}
.g-block-title{font-size:14.5px;font-weight:700;color:var(--text);margin-bottom:11px}
.g-block p{font-size:13px;color:var(--text2);line-height:1.8}
.code-ex{background:var(--bg3);border-radius:var(--rs);padding:14px 18px;font-family:monospace;font-size:13px;color:var(--text);margin-top:11px;line-height:2.2;border:1px solid var(--border)}

/* FOOTER */
footer,footer *{--surface:#07090F;--bg:#07090F;--bg2:#07090F;--bg3:#07090F}
footer{background:#07090F;color:rgba(255,255,255,0.55);padding:44px 24px 26px}
.foot-inner{max-width:1160px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:28px;align-items:start}
.foot-logo-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.foot-logo-img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#fff}
.foot-logo-text{color:#fff;font-size:16px;font-weight:700}
.foot-logo-text span{color:var(--gold)}
.foot-sub{font-size:12.5px;color:rgba(255,255,255,0.38);margin-bottom:13px}
.foot-note{font-size:12px;color:rgba(255,255,255,0.28);font-style:italic;max-width:360px}
.foot-links{display:flex;flex-direction:column;gap:8px;background:none!important}
.foot-links a{color:rgba(255,255,255,0.5);text-decoration:none;font-size:13px;font-weight:500;cursor:pointer;transition:color .18s}
.foot-links a:hover{color:var(--gold-l)}
.foot-bottom{max-width:1160px;margin:24px auto 0;padding-top:18px;border-top:1px solid rgba(255,255,255,0.07);font-size:11.5px;color:rgba(255,255,255,0.22);text-align:center}
.foot-admin-trigger{cursor:pointer;opacity:.4;font-size:10px;margin-left:8px;transition:opacity .2s}
.foot-admin-trigger:hover{opacity:1}

/* ═══════════ ADMIN PANEL ═══════════ */
.admin-overlay{position:fixed;inset:0;z-index:9000;background:var(--bg);display:none;flex-direction:column}
.admin-overlay.open{display:flex}
.admin-nav{background:var(--blue);padding:0 24px;display:flex;align-items:center;gap:16px;height:58px;flex-shrink:0}
.admin-nav-logo{color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.admin-nav-logo img{width:28px;height:28px;border-radius:7px;object-fit:cover}
.admin-nav-logo span{color:var(--gold-l)}
.admin-tabs{display:flex;gap:4px;margin-left:20px;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.admin-tabs::-webkit-scrollbar{display:none}
.admin-tab{padding:6px 15px;border-radius:8px;border:none;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.65);font-family:'Poppins',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .18s}
.admin-tab.active,.admin-tab:hover{background:rgba(255,255,255,0.2);color:#fff}
.admin-close{margin-left:auto;background:rgba(255,255,255,0.15);border:none;color:#fff;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:background .18s}
.admin-close:hover{background:rgba(220,38,38,0.6)}
.admin-body{flex:1;overflow-y:auto;padding:28px 24px;max-width:1100px;margin:0 auto;width:100%}
.admin-panel{display:none}.admin-panel.active{display:block}
.admin-section-title{font-size:1.2rem;font-weight:700;color:var(--text);margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}

/* Admin songs table */
.songs-table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:var(--r);overflow:hidden;border:1px solid var(--border)}
.songs-table th{background:var(--bg3);font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;padding:11px 14px;text-align:left;border-bottom:1px solid var(--border)}
.songs-table td{padding:12px 14px;font-size:13px;color:var(--text);border-bottom:1px solid var(--border);vertical-align:middle}
.songs-table tr:last-child td{border-bottom:none}
.songs-table tr:hover td{background:var(--bg3)}
.songs-table .td-actions{display:flex;gap:6px}
.songs-table .thumb-mini{width:44px;height:44px;border-radius:8px;object-fit:cover}

/* Admin form */
.admin-form{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:24px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid.wide{grid-template-columns:1fr}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
.form-label{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em}
.form-input,.form-select,.form-textarea{padding:9px 14px;border-radius:var(--rs);border:2px solid var(--border);background:var(--bg2);color:var(--text);font-family:'Poppins',sans-serif;font-size:13px;outline:none;transition:border-color .18s;width:100%}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--blue-mid)}
.form-textarea{resize:vertical;min-height:90px;line-height:1.6}
.form-actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end}

/* PDF upload areas */
.pdf-upload-area{border:2px dashed var(--border);border-radius:var(--rs);padding:22px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;position:relative}
.pdf-upload-area:hover{border-color:var(--gold);background:var(--gold-muted)}
.pdf-upload-area input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.pdf-upload-area.has-file{border-color:var(--blue-mid);background:var(--blue-light)}
.pdf-upload-icon{font-size:28px;margin-bottom:8px}
.pdf-upload-label{font-size:13px;font-weight:600;color:var(--text2)}
.pdf-upload-sub{font-size:11px;color:var(--text3);margin-top:3px}
.pdf-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}

/* Admin login */
.admin-login{position:fixed;inset:0;z-index:9100;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:36px;width:100%;max-width:360px;text-align:center;box-shadow:var(--shadow-lg)}
.login-card img{width:64px;height:64px;border-radius:16px;object-fit:cover;margin:0 auto 16px}
.login-card h2{font-size:1.2rem;font-weight:700;color:var(--text);margin-bottom:4px}
.login-card p{font-size:13px;color:var(--text3);margin-bottom:22px}
.login-err{color:var(--red);font-size:12px;margin-top:8px;display:none}
.login-err.show{display:block}

/* Tag badge for PDF status */
.pdf-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
.pdf-badge.ok{background:rgba(34,197,94,0.15);color:#16a34a}
.pdf-badge.missing{background:var(--bg3);color:var(--text3)}
[data-theme=dark] .pdf-badge.ok{color:#4ade80}

/* Notification toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--blue);color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;z-index:9999;transform:translateY(80px);opacity:0;transition:all .3s;box-shadow:var(--shadow-lg)}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:#16a34a}
.toast.error{background:#dc2626}
.toast.info{background:#0284c7}

/* RESPONSIVE */
@media(max-width:768px){
  .nav-links{display:none;flex-direction:column;position:absolute;top:64px;left:0;right:0;background:var(--nav-bg);border-bottom:1px solid var(--border);padding:10px 20px;gap:2px;z-index:499}
  .nav-links.open{display:flex}
  .hamburger{display:flex}
  .foot-inner{grid-template-columns:1fr}
  .songs-grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:13px}
  .form-grid{grid-template-columns:1fr}
  .pdf-grid{grid-template-columns:1fr}
  .admin-tabs{gap:2px;overflow-x:auto;padding-bottom:4px;flex-wrap:nowrap}
  .admin-tab{font-size:11px;padding:5px 10px;white-space:nowrap;flex-shrink:0}

  /* Song detail */
  .song-wrap{padding:20px 16px 48px}
  .song-htitle{font-size:1.45rem !important}
  .ctrl-row{gap:6px;padding:10px 0;flex-wrap:wrap}
  .transpose-ctrl{margin-left:0;width:100%;justify-content:flex-start;margin-top:2px}
  .font-size-ctrl{margin-top:2px}
  .lyrics-box{padding:18px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .lyric-line{margin-bottom:8px !important}

  /* Download bar */
  .dl-bar{flex-direction:column;align-items:flex-start;padding:16px;gap:12px}
  .dl-btns{flex-direction:column;width:100%;gap:8px}
  .dl-btns>button,.dl-btns>.btn{width:100% !important;justify-content:center;text-align:center;box-sizing:border-box}

  /* Tags */
  .tag-row{gap:5px;flex-wrap:wrap}
  .tag{font-size:10px;padding:2px 8px}
  .inst-btn{padding:6px 12px;font-size:12px}

  /* Hero */
  .hero-title{font-size:2.4rem !important}
  .hero-search-wrap{padding:0 8px}
  #heroStats{gap:10px}
  #heroStats>div{padding:5px 12px;font-size:12px}

  /* Cards */
  .card-body{padding:10px 12px 12px}
  .card-body .card-title{font-size:13px}
  .card-body .card-artist{font-size:11px}

  /* Sections */
  .section{padding:28px 0}
  .section-inner{padding:0 16px}
  .section-hdr{margin-bottom:14px}
  .section-title{font-size:1.1rem}
  .see-all{font-size:12px}

  /* Social */
  .social-grid{grid-template-columns:1fr;gap:10px;margin-top:14px}
  .social-card{padding:13px 16px;gap:12px}

  /* Page hero */
  .page-hero{padding:32px 16px 24px}
  .page-hero h1{font-size:1.5rem}
  .page-hero p{font-size:13px}

  /* Admin */
  .admin-body{padding:14px 16px}
  .songs-table th:nth-child(3),.songs-table td:nth-child(3){display:none}
  .songs-table{font-size:12px}
  .songs-table td,.songs-table th{padding:8px 10px}

  /* Setlist */
  #setlistTabs{gap:6px}
  #setlistTabs button{font-size:11px;padding:6px 12px}
  .font-size-ctrl input[type=range]{width:60px}

  /* Share modal */
  #shareModal>div>div{grid-template-columns:1fr 1fr}
  #shareModal>div{padding:20px 16px}

  /* Guide */
  .g-block{padding:18px 16px}
  .capo-grid{grid-template-columns:1fr 1fr}
}

/* Extra small screens */
@media(max-width:420px){
  .songs-grid{grid-template-columns:1fr 1fr;gap:10px}
  .hero-title{font-size:1.9rem !important}
  .song-htitle{font-size:1.25rem !important}
  .lyrics-box{padding:14px 12px}
  .nav-bar{padding:0 12px}
  .section-inner{padding:0 12px}
  .song-wrap{padding:14px 12px 40px}
  .dl-btns .btn{font-size:12px;padding:8px 12px}
  .page-hero h1{font-size:1.3rem}
  #heroStats{gap:6px}
  #heroStats>div{padding:4px 10px;font-size:11px}
  .admin-tab{font-size:10px;padding:4px 8px}
  .section-title{font-size:1rem}
}

/* ── HERO ANIMATED BG ────────────────────────── */
.hero-bg-canvas{position:absolute;inset:0;overflow:hidden}
.hero-bg-canvas::before{content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,#07101f 0%,#0d1f3c 30%,#1a2a50 60%,#0a1525 100%)}
.hero-bg-canvas::after{content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 70% 60% at 20% 80%,rgba(139,26,26,0.35) 0%,transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 20%,rgba(44,64,116,0.5) 0%,transparent 55%),
    radial-gradient(ellipse 50% 40% at 50% 50%,rgba(201,151,58,0.12) 0%,transparent 60%)}
.hero-stars{position:absolute;inset:0;background-image:
  radial-gradient(1px 1px at 10% 15%,rgba(255,255,255,0.6) 0%,transparent 100%),
  radial-gradient(1px 1px at 25% 35%,rgba(255,255,255,0.4) 0%,transparent 100%),
  radial-gradient(1px 1px at 40% 10%,rgba(255,255,255,0.5) 0%,transparent 100%),
  radial-gradient(1px 1px at 60% 25%,rgba(255,255,255,0.3) 0%,transparent 100%),
  radial-gradient(1px 1px at 75% 8%,rgba(255,255,255,0.6) 0%,transparent 100%),
  radial-gradient(1px 1px at 85% 40%,rgba(255,255,255,0.4) 0%,transparent 100%),
  radial-gradient(1px 1px at 90% 60%,rgba(255,255,255,0.3) 0%,transparent 100%),
  radial-gradient(2px 2px at 15% 55%,rgba(201,151,58,0.5) 0%,transparent 100%),
  radial-gradient(2px 2px at 70% 70%,rgba(201,151,58,0.4) 0%,transparent 100%),
  radial-gradient(1.5px 1.5px at 50% 80%,rgba(255,255,255,0.35) 0%,transparent 100%),
  radial-gradient(1px 1px at 30% 90%,rgba(255,255,255,0.25) 0%,transparent 100%),
  radial-gradient(1px 1px at 95% 85%,rgba(255,255,255,0.4) 0%,transparent 100%)}
.hero-waves{position:absolute;bottom:0;left:0;right:0;height:120px;overflow:hidden}
.hero-wave{position:absolute;bottom:0;left:-10%;width:120%;height:100%;
  background:linear-gradient(to bottom,transparent,rgba(10,20,40,0.3));
  border-radius:50% 50% 0 0 / 20px 20px 0 0}

/* ── LANGUAGE SWITCHER ───────────────────────── */
.lang-switcher{display:flex;align-items:center;background:var(--bg3);border:1.5px solid var(--border);border-radius:100px;padding:2px;gap:2px;flex-shrink:0}
.lang-btn{padding:4px 11px;border-radius:100px;border:none;background:transparent;font-family:'Poppins',sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:var(--text2);transition:all .18s}
.lang-btn.active{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(26,42,74,0.25)}
[data-theme=dark] .lang-btn.active{background:var(--blue-mid)}

/* ── SOCIAL LINKS ────────────────────────────── */
.social-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:20px}
.social-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 20px;text-decoration:none;color:var(--text);transition:all .22s;cursor:pointer}
.social-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:var(--gold-l)}
.social-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.social-label{font-size:13px;font-weight:700;color:var(--text)}
.social-sub{font-size:11px;color:var(--text3);margin-top:1px;word-break:break-all}
.si-ig{background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.si-fb{background:#1877f2}
.si-loc{background:var(--red)}
.si-email{background:var(--blue)}

/* ── COPYRIGHT PAGE ─────────────────────────── */
.copyright-inner{max-width:800px;margin:0 auto;padding:56px 24px}
.copy-header{text-align:center;margin-bottom:40px}
.copy-header h1{font-size:1.8rem;font-weight:800;color:var(--text);margin-bottom:8px}
.copy-header p{color:var(--text3);font-size:14px}
.copy-lang-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:32px}
.copy-tab{padding:7px 20px;border-radius:100px;border:2px solid var(--border);background:var(--surface);font-family:'Poppins',sans-serif;font-size:13px;font-weight:600;cursor:pointer;color:var(--text2);transition:all .18s}
.copy-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.copy-section{display:none}.copy-section.active{display:block}
.copy-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:26px;margin-bottom:16px}
.copy-block-title{font-size:14.5px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.copy-block p{font-size:13.5px;color:var(--text2);line-height:1.8;margin-bottom:8px}
.copy-block p:last-child{margin-bottom:0}
.copy-list-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2);line-height:1.7}
.copy-list-item:last-child{border-bottom:none}
.copy-list-item strong{color:var(--text);font-weight:600;min-width:100px}
.copy-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:100px;font-size:11.5px;font-weight:600;background:rgba(34,197,94,0.12);color:#16a34a;margin-bottom:10px}
[data-theme=dark] .copy-badge{color:#4ade80}

/* ── ADMIN SOCIAL SETTINGS ───────────────────── */
.social-settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media(max-width:600px){.social-settings-grid{grid-template-columns:1fr}}

/* ── IMPROVED ADMIN STYLES ─────────────────── */
.admin-overlay{overflow:hidden}
.admin-body{padding:24px 28px}
.songs-table{border-radius:0;border:none}
.songs-table th{font-size:11.5px;background:var(--bg3);color:var(--text3);position:sticky;top:0;z-index:5}
.songs-table td{vertical-align:middle;border-bottom:1px solid var(--border)}
.songs-table tbody tr{transition:background .15s}
.songs-table tbody tr:hover td{background:var(--bg3)}
.songs-table tbody tr:last-child td{border-bottom:none}
.admin-form{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px 24px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:11.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.form-input,.form-select,.form-textarea{padding:9px 13px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg2);color:var(--text);font-family:'Poppins',sans-serif;font-size:13px;outline:none;transition:border-color .18s;width:100%}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--blue-mid);background:var(--bg)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group.full{grid-column:1/-1}
.form-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end;padding-top:16px;border-top:1px solid var(--border)}
/* PDF upload improvements */
.pdf-upload-area{border:2px dashed var(--border);border-radius:10px;padding:18px;text-align:center;cursor:pointer;transition:all .2s;position:relative;background:var(--bg2)}
.pdf-upload-area:hover,.pdf-upload-area:focus-within{border-color:var(--gold);background:var(--gold-muted)}
.pdf-upload-area.has-file{border-color:#16a34a;background:rgba(34,197,94,0.06);border-style:solid}
.pdf-upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
/* Song table empty state */
.table-empty{text-align:center;padding:40px;color:var(--text3);font-size:13px}
@media(max-width:768px){
  .form-grid{grid-template-columns:1fr}
  .songs-table th:nth-child(4),.songs-table td:nth-child(4){display:none}
}

/* ── FORM THUMBNAIL/PDF UPLOAD ───────── */
#thumbUploadArea{padding:14px;min-height:60px}
.pdf-upload-area.has-file{border-color:#16a34a!important;background:rgba(34,197,94,0.06)!important;border-style:solid!important}
#guitarPdfUploadArea.has-file,#pianoPdfUploadArea.has-file{border-color:#16a34a;background:rgba(34,197,94,0.06);border-style:solid}
.admin-form .form-grid{margin-bottom:0}

/* ── SCROLL TO TOP ── */
#scrollTopBtn{position:fixed;bottom:88px;right:24px;width:44px;height:44px;border-radius:50%;background:var(--blue-mid);color:#fff;border:none;box-shadow:0 4px 16px rgba(44,64,116,0.4);cursor:pointer;font-size:18px;display:none;align-items:center;justify-content:center;z-index:800;transition:opacity .25s,transform .25s}
#scrollTopBtn.show{display:flex}
#scrollTopBtn:hover{background:var(--blue);transform:translateY(-3px)}
@media(max-width:768px){#scrollTopBtn{bottom:80px;right:16px;width:40px;height:40px;font-size:15px}}

/* ── ADMIN NOTE FIELD ── */
.song-admin-note{background:var(--gold-muted);border:1px solid rgba(201,151,58,0.35);border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--text2);margin-top:14px;font-style:italic;line-height:1.7}
.song-admin-note::before{content:'📌 ';font-style:normal}

/* ── POPULARITY SCORE ── */
.pop-score{display:inline-flex;align-items:center;gap:4px;background:var(--gold-muted);border:1px solid rgba(201,151,58,0.3);border-radius:100px;padding:2px 10px;font-size:11px;font-weight:700;color:var(--gold)}

/* ── PERFORMANCE MODE DARK THEME ── */
#performanceMode[data-dark="1"]{
  background:#080B12 !important;
  color:#EEEEFF !important;
  --chord-color:#ff9999;
  --text:#EEEEFF;
  --text2:#8888BB;
  --text3:#404060;
  --bg2:#0D1018;
  --bg3:#141720;
  --border:#1A1D28;
  --surface:#0F1218;
  --blue-mid:#6080CC;
  --gold:#F0C860;
  --red:#CC5555;
  --blue:#4060AA;
}
#performanceMode[data-dark="1"] .sec-lbl{opacity:.85}
#performanceMode[data-dark="1"] input,
#performanceMode[data-dark="1"] select{
  background:#141720 !important;color:#EEEEFF !important;border-color:#1A1D28 !important;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   PERFORMANCE MODE — LIGHT THEME FIXES
   Targets site light theme + PM in its default (light) state.
   All fixes use !important to override inline styles.
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
[data-theme="light"] #performanceMode[data-dark="0"] #perfV2HUD {
  background: linear-gradient(to bottom,rgba(245,247,255,0.97) 0%,rgba(245,247,255,0.84) 68%,transparent 100%) !important;
}
/* Every icon-button in the HUD */
[data-theme="light"] #performanceMode[data-dark="0"] #perfV2HUD button {
  background: rgba(0,0,0,0.07) !important;
  color: #1a2040 !important;
  border-color: rgba(0,0,0,0.1) !important;
}
[data-theme="light"] #performanceMode[data-dark="0"] #perfV2HUD button:hover {
  background: rgba(0,0,0,0.13) !important;
}
/* Panic stays red */
[data-theme="light"] #performanceMode[data-dark="0"] #perfPanicBtn {
  background: rgba(180,30,30,0.1) !important;
  border: 1px solid rgba(180,30,30,0.35) !important;
  color: #9b1c1c !important;
}
/* Song info text */
[data-theme="light"] #performanceMode[data-dark="0"] #perfSongTitle   { color: #0d1a40 !important; }
[data-theme="light"] #performanceMode[data-dark="0"] #perfSongMeta    { color: #4a5568 !important; }
[data-theme="light"] #performanceMode[data-dark="0"] #perfTimerDisplay{ color: #718096 !important; }
[data-theme="light"] #performanceMode[data-dark="0"] #perfCounter {
  background: rgba(0,0,0,0.06) !important;
  border-color: rgba(0,0,0,0.14) !important;
  color: #2d3748 !important;
}
[data-theme="light"] #performanceMode[data-dark="0"] #perfRoleBadge {
  background: rgba(0,0,0,0.08) !important;
  color: #4a5568 !important;
}
/* Inactive language button */
[data-theme="light"] #performanceMode[data-dark="0"] #perfLangEN { color: #4a5568 !important; }

/* ── Section cue pills: dark saturated on light bg ── */
[data-theme="light"] #performanceMode[data-dark="0"] .perf-section-label.sec-verse     { background:rgba(37,99,235,0.18);  border:1px solid rgba(37,99,235,0.45);   color:#1d4ed8; }
[data-theme="light"] #performanceMode[data-dark="0"] .perf-section-label.sec-chorus    { background:rgba(161,98,7,0.18);   border:1px solid rgba(161,98,7,0.45);    color:#92400e; }
[data-theme="light"] #performanceMode[data-dark="0"] .perf-section-label.sec-bridge    { background:rgba(109,40,217,0.18); border:1px solid rgba(109,40,217,0.45);  color:#6d28d9; }
[data-theme="light"] #performanceMode[data-dark="0"] .perf-section-label.sec-prechorus { background:rgba(4,120,87,0.18);   border:1px solid rgba(4,120,87,0.45);    color:#065f46; }
[data-theme="light"] #performanceMode[data-dark="0"] .perf-section-label.sec-intro     { background:rgba(180,83,9,0.18);   border:1px solid rgba(180,83,9,0.45);    color:#9a3412; }
[data-theme="light"] #performanceMode[data-dark="0"] .perf-section-label.sec-outro     { background:rgba(180,83,9,0.18);   border:1px solid rgba(180,83,9,0.45);    color:#9a3412; }
[data-theme="light"] #performanceMode[data-dark="0"] .perf-section-label.sec-interlude { background:rgba(157,23,77,0.18);  border:1px solid rgba(157,23,77,0.45);   color:#9d174d; }
[data-theme="light"] #performanceMode[data-dark="0"] .perf-section-label.sec-default   { background:rgba(0,0,0,0.1);       border:1px solid rgba(0,0,0,0.2);        color:#4a5568; }

/* ── Next-section bar at bottom ── */
[data-theme="light"] #performanceMode[data-dark="0"] #perfNextSectionBar {
  background: rgba(245,247,255,0.92) !important;
  border-color: rgba(0,0,0,0.1) !important;
  color: #4a5568 !important;
}
[data-theme="light"] #performanceMode[data-dark="0"] #perfNextSectionLabel { color: #1a2040 !important; }

/* ── Section flash & count-in: dark text on light bg ── */
[data-theme="light"] #performanceMode[data-dark="0"] #perfSectionFlash {
  color: #0d1a40 !important;
  text-shadow: 0 1px 16px rgba(0,0,0,0.08) !important;
}
[data-theme="light"] #performanceMode[data-dark="0"] #perfCountInNum {
  color: #0d1a40 !important;
}
/* Count-in beat dots */
[data-theme="light"] #performanceMode[data-dark="0"] .ci-beat-dot {
  background: rgba(0,0,0,0.12);
}
[data-theme="light"] #performanceMode[data-dark="0"] .ci-beat-dot.active {
  background: var(--gold);
}

/* ── Read-zone hairline: gold but visible on light ── */
[data-theme="light"] #performanceMode[data-dark="0"] #perfReadZoneLine {
  background: linear-gradient(90deg,transparent 0%,rgba(161,98,7,0.5) 20%,rgba(161,98,7,0.5) 80%,transparent 100%);
}

/* ── Drawer inputs already use var(--bg2)/var(--text) so they're fine ── */
/* Lyrics smooth rendering */
#perfLyricsContent{
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}


/* ── PERF V2 LYRIC LINE HIGHLIGHT ── */
.perf-lyric-line{transition:opacity .3s,transform .3s,filter .3s;}
.perf-lyric-line.active-line{opacity:1 !important;transform:scale(1.025);filter:none;}
.perf-lyric-line.dim-line{opacity:0.28 !important;filter:blur(0.3px);}
/* Yellow-line highlight suppressed (user toggled it off) */
#performanceMode.no-line-hl .perf-lyric-line.active-line{transform:none !important;}
#performanceMode.no-line-hl .perf-lyric-line.dim-line{opacity:1 !important;filter:none !important;}

/* ── SECTION CUE COLORS ── */
.perf-section-label{display:inline-block;font-family:'Poppins',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:2px 10px;border-radius:20px;margin-bottom:6px;}
.perf-section-label.sec-verse{background:rgba(96,165,250,0.18);color:#93c5fd;}
.perf-section-label.sec-chorus{background:rgba(240,192,64,0.18);color:#fcd34d;}
.perf-section-label.sec-bridge{background:rgba(167,139,250,0.22);color:#c4b5fd;}
.perf-section-label.sec-prechorus{background:rgba(52,211,153,0.18);color:#6ee7b7;}
.perf-section-label.sec-intro{background:rgba(251,146,60,0.18);color:#fdba74;}
.perf-section-label.sec-outro{background:rgba(251,146,60,0.18);color:#fdba74;}
.perf-section-label.sec-interlude{background:rgba(244,114,182,0.18);color:#f9a8d4;}
.perf-section-label.sec-default{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.6);}

/* ── SECTION FLASH animation ── */
@keyframes perfFlashIn{from{opacity:0;transform:scale(0.85)}to{opacity:1;transform:scale(1)}}
@keyframes perfFlashOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.08)}}
#perfSectionFlash.flash-in{animation:perfFlashIn .15s ease-out forwards;}
#perfSectionFlash.flash-out{animation:perfFlashOut .3s ease-in forwards;}

/* ── COUNT-IN animation ── */
@keyframes countPulse{0%{transform:scale(1.3);opacity:1}100%{transform:scale(1);opacity:0.85}}
#perfCountInNum.beat{animation:countPulse .12s ease-out forwards;}
.ci-beat-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.2);transition:background .08s,transform .08s;}
.ci-beat-dot.active{background:#f0c040;transform:scale(1.4);}

/* ── SONG CHANGE transition ── */
@keyframes perfSlideInRight{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes perfSlideInLeft{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:translateX(0)}}
#perfContent.anim-in-right{animation:perfSlideInRight .3s cubic-bezier(.25,.46,.45,.94) forwards;}
#perfContent.anim-in-left{animation:perfSlideInLeft .3s cubic-bezier(.25,.46,.45,.94) forwards;}

/* ── PERFORMANCE MODE enter animation ── */
@keyframes perfEnter{from{opacity:0;transform:scale(0.97)}to{opacity:1;transform:scale(1)}}
#performanceMode.perf-entering{animation:perfEnter .4s cubic-bezier(.25,.46,.45,.94) forwards;}

/* ── PERF V2 HUD auto-hide ── */
#perfV2HUD{transition:opacity .5s;}
#perfV2HUD.hidden{opacity:0.06;pointer-events:none;}

/* ── PERF V2 SETLIST items in drawer ── */
#perfSongList button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:9px;border:none;background:transparent;color:var(--text2);font-family:'Poppins',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:background .15s;}
#perfSongList button:hover{background:var(--bg3);}
#perfSongList button.perf-song-active{background:var(--blue-mid);color:#fff;font-weight:700;}

/* ── ROLE PICKER cards ── */
.perf-role-card{display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:16px 12px;cursor:pointer;transition:all .18s;font-family:'Poppins',sans-serif;color:#fff;touch-action:manipulation;}
.perf-role-card:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.25);transform:translateY(-2px);}
.perf-role-card:active{transform:scale(0.96);background:rgba(255,255,255,0.12);}
.perf-role-card.selected{border-color:var(--gold);background:rgba(240,192,64,0.12);}
.perf-role-card .role-icon{font-size:28px;line-height:1;}
.perf-role-card .role-name{font-size:12px;font-weight:700;letter-spacing:.02em;}
.perf-role-card .role-desc{font-size:10px;color:rgba(255,255,255,0.45);text-align:center;line-height:1.4;}
/* category cards (level 1) are a bit taller */
.perf-role-cat-card{min-height:96px;}
/* sub-role screen slide animation */
#perfRoleSubScreen{animation:slideInRight .2s ease;}
@keyframes slideInRight{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
#perfRoleCatScreen{animation:fadeInPicker .18s ease;}
@keyframes fadeInPicker{from{opacity:0}to{opacity:1}}
/* role picker grid: 3 cols on wide, 2 on narrow phones */
#perfRoleCatGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
#perfRoleSubGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media(max-width:400px){#perfRoleCatGrid{grid-template-columns:repeat(2,1fr);}}

/* ── MIC SCROLL beat dots ── */
#perfAudioBar{transition:opacity .3s;}
@keyframes micPulse{0%{opacity:1;transform:scaleX(1)}100%{opacity:.3;transform:scaleX(.6)}}

/* ── PERF MODE MOBILE — V2 ── */
@media(max-width:768px){
  #perfContent{padding:68px 12px 36px}
  #perfV2HUD > div{padding:8px 10px;min-height:52px;gap:5px;}
  #perfV2Drawer{width:min(290px,92vw)}
  #perfV2SetlistDrawer{width:min(260px,88vw)}
  #perfSectionSidebar{right:4px;padding:4px 3px;gap:4px;}
  #perfSectionSidebar button:first-child{width:38px;font-size:10px;padding:5px 2px;}
  /* Arrangement rows: horizontal scroll on tablets */
  /* Bug 14 fix: scroll must live on #perfArrChips itself, NOT on .perf-arr-chips-row —
     putting overflow-x:auto on the row would scroll the "Rend:" label and reset button too.
     #perfArrChips already has flex:1;min-width:0 so it fills the middle and clips correctly. */
  .perf-arr-add-row{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .perf-arr-add-row::-webkit-scrollbar{display:none;}
  #perfArrChips{
    flex-wrap:nowrap;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    /* Fade edges so musicians can see there are more chips to scroll */
    -webkit-mask-image:linear-gradient(to right,transparent,#000 10px,#000 calc(100% - 10px),transparent);
    mask-image:linear-gradient(to right,transparent,#000 10px,#000 calc(100% - 10px),transparent);
  }
  #perfArrChips::-webkit-scrollbar{display:none;}
}
/* Hide native scrollbar in Performance Mode lyrics pane — PM is a fullscreen teleprompter */
#perfContent{scrollbar-width:none;}
#perfContent::-webkit-scrollbar{display:none;}
@media(max-width:480px){
  /* Song meta + timer: hidden — title alone is enough */
  #perfV2HUD #perfSongMeta{display:none}
  #perfV2HUD #perfTimerDisplay{display:none}
  /* Hide secondary HUD icons — all reachable from ⚙️ drawer */
  #perfPDFBtn,#perfLiveSyncBtn,#perfRoleBadge{display:none !important;}
  #perfV2HUD button[title="Ekran i Plotë (F)"]{display:none !important;}
  /* Minimum 40px touch targets for remaining HUD buttons */
  #perfV2HUD > div > button{min-height:40px;}
  #autoScrollBtn{padding:7px 12px !important;font-size:11px !important;}
  /* Panic + exit: keep them but smaller */
  #perfPanicBtn{padding:5px 7px !important;}
  /* iPhone SE / small screens */
  #perfControlsBar>div{gap:4px;padding:5px 8px;}
  #perfControlsBar input[type=range]{width:40px;}
  #perfSongList button{padding:4px 10px;font-size:10px;}
  /* Section sidebar even more compact */
  #perfSectionSidebar{right:2px;}
  #perfSectionSidebar>div>button{width:34px;font-size:9px;}
  /* Hide repeat controls on very small screens */
  #perfSectionSidebar>div>div{display:none;}
  /* Lyrics right padding to clear sidebar — !important to override inline style */
  #perfContent>div>div:last-child{padding-right:44px !important;}
}
@media(max-width:360px){
  /* Ultra-narrow (Galaxy Fold, etc.) — hide sidebar entirely, swipe is enough */
  #perfSectionSidebar{display:none !important;}
  #perfContent>div>div:last-child{padding-right:8px !important;}
}
/* ── GENERAL MOBILE ── */
@media(max-width:600px){
  .song-wrap{padding:14px 12px 40px}
  .dl-bar{flex-wrap:wrap;gap:6px;}
  .songs-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
  .f-select{font-size:13px;padding:7px 8px;}
  #chordPopup{left:50% !important;transform:translateX(-50%);width:160px;}
  .similar-grid{grid-template-columns:repeat(2,1fr);}
}

/* ── CHORD DIAGRAM POPUP ── */
.chord-popup{position:absolute;z-index:200;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;box-shadow:0 8px 32px rgba(0,0,0,0.2);pointer-events:none;min-width:80px;text-align:center}
.chord-popup svg{display:block;margin:0 auto}
.chord-popup-name{font-size:11px;font-weight:700;color:var(--text);margin-bottom:6px}
.chord-clickable{cursor:help;position:relative;display:inline-block}
.chord-clickable:hover{color:var(--gold)}

/* ── METRONOME ── */
.metro-beat{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--red);opacity:0;transition:opacity .05s}
.metro-beat.on{opacity:1}

/* ── SIMILAR SONGS ── */
.similar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px}

/* ── PRINT ── */
@media print{
  /* Show only the song detail page; hide all navigation and UI chrome */
  nav,#bottomNav,.page-header,.back-btn,
  .song-actions,.song-action-row,.btn-group,
  .similar-section,.similar-grid,
  #page-home,#page-songs,#page-favorites,#page-setlist,
  #page-guide,#page-contact,#page-request,
  #perfOverlay,#adminOverlay,
  footer,.footer,#siteFooter,
  .section,.hero,#heroSection,
  #recentlyViewedSection,#favSection,
  .nav-links,.hamburger,.lang-toggle,
  .toast,#toastContainer,
  .modal,#shareModal,#chordModal,
  button:not(.print-keep),
  .ac-drop,.song-notes-actions{
    display:none!important;
  }
  /* Make the song detail fill the whole page */
  body{ background:#fff!important; color:#000!important; font-size:12pt; }
  .page{ display:block!important; opacity:1!important; }
  #page-song{ display:block!important; padding:0; }
  .song-wrap{ max-width:100%; padding:0; }
  /* Song title + meta */
  .song-title{ font-size:20pt; font-weight:700; margin-bottom:6pt; }
  .song-meta{ font-size:10pt; color:#555; margin-bottom:16pt; }
  /* Chord sheet */
  .lyrics-block,.chords-block,.song-lyrics{ font-size:11pt; line-height:1.7; }
  .chord-name{ color:#1a2a4a; font-weight:700; }
  /* Keep musician notes visible */
  .song-notes-box{ border:1px solid #ccc; padding:8pt; margin-top:16pt; border-radius:4pt; }
  .song-notes-box label{ font-size:9pt; color:#888; display:block; margin-bottom:4pt; }
  /* Page breaks */
  .song-section{ page-break-inside:avoid; }
  /* Footer watermark */
  .print-credit{ display:block!important; text-align:center; font-size:8pt; color:#aaa; margin-top:24pt; border-top:1px solid #eee; padding-top:8pt; }
}
/* Hidden except when printing */
.print-credit{ display:none; }

</style>

</head>
<body>

<div class="toast" id="toast"></div>
<!-- SCROLL TO TOP -->
<button id="scrollTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Kthehu lart">↑</button>

<!-- NAV -->
<nav>
